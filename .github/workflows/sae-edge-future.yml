name: SAE EDGE CORE — future repository discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'
permissions:
  contents: read
jobs:
  catalog-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cross-repository draft PR enrollment (no merges, no deployments)
        env:
          SAE_FEDERATION_TOKEN: ${{ secrets.SAE_FEDERATION_TOKEN }}
        run: |
          python3 sae-edge/future-onboard.py --apply
