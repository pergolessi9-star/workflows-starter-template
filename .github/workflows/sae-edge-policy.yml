name: SAE EDGE CORE enrollment check
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - ".sae/edge-core.json"
      - ".github/workflows/sae-edge-policy.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate SAE EDGE CORE manifest (no routing activated)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          p = pathlib.Path(".sae/edge-core.json")
          if not p.is_file():
              print("No .sae/edge-core.json found: not enrolled.")
              sys.exit(0)
          j = json.loads(p.read_text())
          assert j["schema_version"] == 1
          assert j["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert j["control_plane_url"] == "https://sae-edge-core-30.pages.dev/"
          g = j["gateway"]
          assert g["mode"] == "catalog-only" and g["enabled"] is False
          assert g["origin"] is None
          print("SAE EDGE CORE catalog enrollment validated; runtime gateway disabled.")
          PY
